<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Bio - Duc Kien</title>

  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

  <style>
    :root {
      --primary-pink: #ff4d6d; 
      --soft-pink: #ff8fab;
      --light-pink: #ffe5ec;
      --glass-white: rgba(255, 255, 255, 0.92);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ffffff 0%, #ffdde1 50%, #ffc8dd 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center; 
      justify-content: center; 
      color: var(--primary-pink); 
      overflow-x: hidden;
      padding: 40px 10px;
    }

    .tiltWrap {
      width: 100%;
      max-width: 650px; 
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .panel {
      width: 100%;
      background: var(--glass-white); 
      backdrop-filter: blur(20px);
      border-radius: 50px;
      border: 3px solid #fff; 
      box-shadow: 0 15px 50px rgba(255, 143, 171, 0.2);
      overflow: hidden; 
      padding-bottom: 40px;
      text-align: center;
    }

    /* BANNER */
    .profileTheme {
      height: 250px;
      width: 100%;
      background-color: #fff;
    }
    .profileBanner {
      width: 100%; height: 100%;
      background-image: url('cin.gif'); 
      background-size: 100% auto;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    /* AVATAR & DECOR */
    .dAvatarWrap {
      position: relative;
      width: 160px; height: 160px;
      margin: -90px auto 15px;
      z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }
    .dAvatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #fff;
      background: #fff;
    }
    #decorHolder {
      position: absolute;
      width: 130%; height: 130%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .dDisplayName {
      font-family: 'Cherry Bomb One', cursive;
      font-size: clamp(35px, 8vw, 60px);
      margin-bottom: 10px;
      color: var(--primary-pink); 
      text-shadow: 2px 2px 0px #fff; 
    }

    /* STATUS CARD */
    .status-card {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      padding: 15px 25px;
      margin: 0 25px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border: 1.5px solid var(--light-pink);
    }
    .user-left { display: flex; align-items: center; gap: 12px; }
    .status-mini-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #fff; }
    .status-username { font-weight: 700; font-size: 17px; }
    #discordStatus { font-size: 12px; font-weight: 700; color: #8a5a65; text-align: right; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* BIO AUTO EXPAND */
    .bio-card {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 20px;
      margin: 0 25px 25px;
      text-align: left;
      border: 1px solid var(--light-pink);
      line-height: 1.6;
      color: #5e4b50;
      font-size: 14px;
      font-weight: 500;
      word-wrap: break-word;
    }

    /* PLAYER */
    .spotify-player {
      background: #fff;
      border-radius: 35px;
      padding: 25px 30px;
      margin: 0 25px 30px;
      border: 2px solid var(--light-pink);
    }
    #songTitle { font-weight: 700; font-size: 15px; margin-bottom: 20px; display: block; }
    .controls-row { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 20px; }
    .s-btn { background: none; border: none; color: var(--soft-pink); font-size: 26px; cursor: pointer; transition: 0.2s; }
    .play-circle { width: 55px; height: 55px; border-radius: 50%; background: var(--primary-pink); color:#fff; border:none; display: grid; place-items:center; cursor:pointer; }

    .time-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
    .progress-area { flex: 1; height: 6px; background: #ffe5ec; border-radius: 10px; cursor: pointer; }
    .progress-bar { height: 100%; background: var(--primary-pink); border-radius: 10px; width: 0%; }

    /* SOCIAL LINKS */
    .links2 { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 0 20px; }
    .appBtn {
      width: 55px; height: 55px; border-radius: 18px;
      background: #fff; border: 2px solid var(--light-pink);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary-pink); font-size: 26px; transition: 0.3s;
      text-decoration: none; overflow: hidden;
    }
    /* Style cho file locket.png */
    .appBtn img {
      width: 50px; height: 50px; 
      object-fit: contain; 
      border-radius: 6px;
      display: block;
    }
    .appBtn:hover { transform: translateY(-5px); background: var(--primary-pink); color: #fff; }

    /* POPUP RIOT */
    .valoModal { display: none; position: fixed; inset: 0; background: rgba(255, 182, 193, 0.5); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; }
    .valoModal.active { display: flex; }
    .valoCard { background: #fff; padding: 30px; border-radius: 30px; width: 90%; max-width: 350px; text-align: center; border: 3px solid var(--light-pink); position: relative; }

    #oneko { pointer-events: none; }
  </style>
</head>

<body>
  <div class="tiltWrap">
    <div class="panel">
      <div class="profileTheme"><div class="profileBanner"></div></div>

      <div class="dAvatarWrap">
        <img class="dAvatar" id="avatar" alt="Avatar">
        <div id="decorHolder"></div>
      </div>

      <h1 class="dDisplayName">edetiu</h1>

      <div class="status-card">
        <div class="user-left">
          <img class="status-mini-avatar" id="avatar2" alt="Avatar">
          <div class="status-username">detiu_</div>
        </div>
        <div id="discordStatus">Loading status...</div>
      </div>

      <div class="bio-card">
        Thuy Tien <br>
        hi
      </div>

      <div class="spotify-player">
        <audio id="audio"></audio>
        <span id="songTitle">Sweet Melodies...</span>
        <div class="controls-row">
          <button type="button" class="s-btn" id="shuffleBtn" style="opacity:0.4;"><iconify-icon icon="ph:shuffle-bold"></iconify-icon></button>
          <button type="button" class="s-btn" id="prevBtn"><iconify-icon icon="ph:skip-back-fill"></iconify-icon></button>
          <button type="button" class="play-circle" id="playBtn"><iconify-icon id="playIcon" icon="ph:play-fill"></iconify-icon></button>
          <button type="button" class="s-btn" id="nextBtn"><iconify-icon icon="ph:skip-forward-fill"></iconify-icon></button>
          <button type="button" class="s-btn" id="loopBtn" style="opacity:0.4;"><iconify-icon icon="ph:repeat-bold"></iconify-icon></button>
        </div>
        <div class="time-row">
          <span id="currTime">0:00</span>
          <div class="progress-area" id="progressArea"><div class="progress-bar" id="progressBar"></div></div>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="links2">
        <a class="appBtn" href="https://discord.com/users/1462094152215953441" target="_blank"><iconify-icon icon="fa6-brands:discord"></iconify-icon></a>
        <a class="appBtn" href="https://www.facebook.com/ngy.my.th.tien" target="_blank"><iconify-icon icon="fa6-brands:facebook"></iconify-icon></a>
        <button class="appBtn" id="valoBtn"><iconify-icon icon="simple-icons:riotgames"></iconify-icon></button>
        <a class="appBtn" href="https://www.instagram.com/_ngy.ttien_" target="_blank"><iconify-icon icon="fa6-brands:instagram"></iconify-icon></a>
        <a class="appBtn" href="https://www.tiktok.com/@ngy_ttien" target="_blank"><iconify-icon icon="fa6-brands:tiktok"></iconify-icon></a>
        <!-- ĐÃ ĐỂ LẠI FILE LOCKET.PNG CỦA BẠN -->
        <a class="appBtn" href="https://locket.cam/nmttienn" target="_blank">
          <img src="locket.png" alt="L">
        </a>
      </div>
    </div>
  </div>

  <div class="valoModal" id="valoModal">
    <div class="valoCard">
      <button id="valoClose" style="position:absolute; top:15px; right:15px; border:none; background:none; cursor:pointer; color:#ccc;">✕</button>
      <h2 style="font-family: 'Cherry Bomb One'; color: var(--primary-pink); margin-bottom: 10px;">Riot ID</h2>
      <p style="font-size: 28px; font-weight: 700; color: #555;">Darwin#2000</p>
    </div>
  </div>

  <script>
    const AVATAR_URL = "chi.gif";
    const DECOR_LIST = [
      "https://cdn.discordapp.com/avatar-decoration-presets/a_4ecf139a79f8ef0045e2346d2ce6e5b8.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_3c97a2d37f433a7913a1c7b7a735d000.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_98555e40cc6802bd3a4fed906af1d992.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_af21a730b99ed414e520decfea99aa79.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_22166be7fd3b6b851108eb93ca9200a9.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_7f44d538ec830f479605f7bf8720afda.png?size=160",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_322c506cac670b3fc9915c44d1bcbe47.png?size=160",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_741750ac1c9091a58059be33590c2821.png?size=160",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_f081c6b2c85c5ebe5df42f1c24d45bb5.png?size=160"
    ];

    document.getElementById("avatar").src = AVATAR_URL;
    document.getElementById("avatar2").src = AVATAR_URL;

    function setRandomDecor(){
      const holder = document.getElementById("decorHolder");
      const randomDecor = DECOR_LIST[Math.floor(Math.random() * DECOR_LIST.length)];
      holder.innerHTML = `<img src="${randomDecor}" style="width: 100%; height: 100%; object-fit: contain;">`;
    }
    setRandomDecor();

    // Riot Popup
    const vBtn = document.getElementById("valoBtn");
    const vModal = document.getElementById("valoModal");
    vBtn.onclick = () => vModal.classList.add("active");
    document.getElementById("valoClose").onclick = () => vModal.classList.remove("active");

    // Music Logic
    const playlist = [
      { title: "Dự báo thời tiết hôm nay mưa", src: "nhac.mp3" },
      { title: "Chấm xám - SIVAN", src: "nhac2.mp3" },
      { title: "Hngle - Buông", src: "nhac3.mp3" }
    ];
    let songIndex = 0;
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    function loadSong(s) { document.getElementById("songTitle").innerText = s.title; audio.src = s.src; }
    loadSong(playlist[songIndex]);

    playBtn.onclick = () => {
      if (audio.paused) { audio.play(); playIcon.setAttribute("icon", "ph:pause-fill"); }
      else { audio.pause(); playIcon.setAttribute("icon", "ph:play-fill"); }
    };
    document.getElementById("nextBtn").onclick = () => { songIndex = (songIndex + 1) % playlist.length; loadSong(playlist[songIndex]); audio.play(); playIcon.setAttribute("icon", "ph:pause-fill"); };
    document.getElementById("prevBtn").onclick = () => { songIndex = (songIndex - 1 + playlist.length) % playlist.length; loadSong(playlist[songIndex]); audio.play(); playIcon.setAttribute("icon", "ph:pause-fill"); };

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const p = (audio.currentTime / audio.duration) * 100;
        document.getElementById("progressBar").style.width = p + "%";
        document.getElementById("currTime").innerText = formatTime(audio.currentTime);
        document.getElementById("durTime").innerText = formatTime(audio.duration);
      }
    };
    function formatTime(s) { const min = Math.floor(s/60); const sec = Math.floor(s%60); return min + ":" + sec.toString().padStart(2, '0'); }
    document.getElementById("progressArea").onclick = (e) => { audio.currentTime = (e.offsetX / document.getElementById("progressArea").clientWidth) * audio.duration; };

    // Discord Status
    const DISCORD_ID = "1462094152215953441";
    async function loadStatus(){
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/1462094152215953441`);
        const json = await res.json();
        const data = json.data;
        const statusMap = { online: "Online 🟢", idle: "Idle 🌙", dnd: "DND ⛔", offline: "Offline ⚫" };
        let finalStatus = statusMap[data.discord_status] || "Offline ⚫";
        if (data.listening_to_spotify && data.spotify) { finalStatus = `Listening to ${data.spotify.song} 🎵`; }
        document.getElementById("discordStatus").innerText = finalStatus;
      } catch(e){}
    }
    loadStatus(); setInterval(loadStatus, 15000);
  </script>

  <script src="https://cdn.jsdelivr.net/gh/adryd325/oneko.js@main/oneko.js" defer></script>
</body>
</html>
